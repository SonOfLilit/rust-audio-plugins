[package]
name = "bloop-stretch"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

# Time-stretching and pitch-shifting: a Rust port of Bungee Basic by
# Parabola Research Limited (MPL-2.0), the stretcher Just-a-Sample's
# ADVANCED playback mode runs. Ported from Bungee v2.4.10, rev
# 2745718c2751bd655d7c5ed4853955de492bb39f — the revision pinned by the
# vendor/bungee submodule, which the gold tests compile. Every file of the
# port is MPL-2.0 like the file it was ported from; LICENSE is Bungee's.

[features]
# Compare the port against the C++ original (tests/gold.rs). Needs g++ and
# the vendor/bungee submodule with its eigen and pffft submodules.
gold = []

[dependencies]
libm = "0.2"
rustfft = { version = "6.4.1", default-features = false }

[dev-dependencies]
expect-test = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
# A port held to its original converts between float, double and the
# integer phase types exactly where the original does.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
float_cmp = "allow"
many_single_char_names = "allow"
