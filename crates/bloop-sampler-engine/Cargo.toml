[package]
name = "bloop-sampler-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Sample playback voice: a 1:1 Rust port of Just-a-Sample's `CustomSamplerVoice`
# in BASIC playback mode (github.com/BOBONA/Just-a-Sample, MIT, rev pinned in
# `PORTED_FROM_JAS_REV`). The FX chain and the Bungee (ADVANCED) playback mode
# are deliberately not ported — see the crate docs. The manual's License page
# cites the pinned revision (`every_notice_cites_its_pinned_revision` in bloop-synths).

[dependencies]
# The voice's transcendentals go through libm rather than std so that the
# same project renders identically in the browser and on the desktop: std's
# `exp`, `powf` and friends are the C library's on native and a separate
# Rust implementation on wasm32, and they disagree in the last ulp. The
# demo gold hashes rendered audio, so that disagreement is a test failure —
# see `a_shaped_envelope_is_identical_on_every_platform`.
libm = "0.2"
symphonia = { workspace = true }

[dev-dependencies]
expect-test = { workspace = true }
flacenc = { version = "0.5.1", default-features = false }
wasm-bindgen-test = { workspace = true }
