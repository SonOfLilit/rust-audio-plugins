[package]
name = "bloop-plugin-socalabs"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause AND MIT AND ISC AND WTFPL"

# The SocaLabs effects as bloop Plug-ins: a Rust port of slPlugins' effect
# processors and the Gin DSP they are built from, both by Roland Rabien.
# Ported from slPlugins rev 034facd9cf74fa4a7a6312a8ebf4cbde1d357dac and
# Gin rev c983c0db166c6482b94d6227dacf9a35b8b9d59c — the revisions pinned by
# the vendor/slplugins and vendor/gin submodules, which the gold tests
# compile. The Chorus's knobs are SocaLabs Wavetable's, at Wavetable rev
# 5f932ff87c453d32cebee233af1fde946f53ac89 (BSD-3-Clause), whose Gin
# submodule is that same Gin rev. LICENSE carries every licence the port
# inherits.
#
# No JUCE code is ported. What the originals take from JUCE (decibels,
# parameter ranges, float comparison) is rewritten from its documented
# behaviour in src/juce.rs; the gold tests link the real JUCE to hold it to
# that.

[features]
# Bit-exact comparison against the C++ originals (tests/it/gold.rs). Needs g++
# and the vendor/slplugins, vendor/gin and vendor/juce submodules. Also
# switches the transcendentals to the platform C library the C++ links, so
# that a mismatch is the port's and not the maths library's (src/math.rs).
gold = []

# What `gold` compiles: tools/plugin-tests.py turns it on when these are
# checked out.
[package.metadata.plugin-tests]
gold-needs = ["vendor/slplugins", "vendor/gin", "vendor/juce"]

[dependencies]
bloop-core = { workspace = true }
bloop-events = { workspace = true }
bloop-plugin-api = { workspace = true }
libm = "0.2"

[dev-dependencies]
expect-test = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
# A port that is bit-exact against C++ has to convert between float, double
# and int exactly where the original does, and compare floats exactly where
# it does; the gold tests are what hold those conversions to the original's.
# Flagging each one would bury the few that matter under hundreds that are
# the point.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
float_cmp = "allow"
many_single_char_names = "allow"
# `(a + b) / 2` is what the originals compute; `f32::midpoint` rounds
# differently.
manual_midpoint = "allow"
